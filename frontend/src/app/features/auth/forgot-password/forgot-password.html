<app-auth-card
  class="theme-shop"
  heading="Forgot password"
  subheading="We'll email you a link to choose a new password."
>
  @if (message(); as sent) {
    <div class="flex flex-col gap-4">
      <app-alert type="success">{{ sent }}</app-alert>
      <p class="text-sm text-stone-600">
        The link expires in 1 hour. Check your spam folder if it doesn't arrive.
      </p>
      <a routerLink="/login" class="btn btn-primary w-full">Back to sign in</a>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
      <div>
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="showError(form.controls.email, submitted())"
          placeholder="admin@example.com"
        />
        @if (showError(form.controls.email, submitted())) {
          <p class="form-error">Enter a valid email address.</p>
        }
      </div>

      @if (error()) {
        <app-alert type="error">{{ error() }}</app-alert>
      }

      <button type="submit" class="btn btn-primary w-full" [disabled]="submitting()">
        {{ submitting() ? 'Sending…' : 'Send reset link' }}
      </button>
    </form>
  }

  <p footer>
    Remembered it?
    <a routerLink="/login" class="link">Sign in</a>
  </p>
</app-auth-card>
