<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
      <a routerLink="/orders" class="flex items-center gap-2 font-semibold text-slate-900">
        <span
          class="grid size-8 place-items-center rounded-lg bg-indigo-600 text-sm font-bold text-white"
          aria-hidden="true"
        >
          AO
        </span>
        <span>{{ appName }}</span>
      </a>

      <nav
        class="order-last -mx-1 flex w-full gap-1 overflow-x-auto sm:order-0 sm:w-auto"
        aria-label="Main"
      >
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            ariaCurrentWhenActive="page"
            class="rounded-md px-3 py-2 text-sm font-medium whitespace-nowrap text-slate-600 hover:bg-slate-100 hover:text-slate-900"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <div class="ml-auto flex items-center gap-3">
        <a routerLink="/orders/new" class="btn btn-primary btn-sm">+ New order</a>

        @if (user(); as currentUser) {
          <a
            routerLink="/account"
            routerLinkActive="text-indigo-700"
            class="hidden text-right leading-tight hover:text-indigo-700 md:block"
            title="Account settings"
          >
            <span class="block text-sm font-medium text-slate-900">{{ currentUser.fullName }}</span>
            <span class="block text-xs text-slate-500">{{ currentUser.email }}</span>
          </a>
        }

        <button
          type="button"
          class="btn btn-secondary btn-sm"
          [disabled]="signingOut()"
          (click)="signOut()"
        >
          {{ signingOut() ? 'Signing out…' : 'Sign out' }}
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:py-8">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    {{ appName }}
  </footer>
</div>
