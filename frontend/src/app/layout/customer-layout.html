<div class="theme-shop min-h-screen lg:flex">
  <!-- Sidebar -->
  @if (sidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-20 bg-stone-900/40 lg:hidden"
      aria-label="Close menu"
      (click)="closeSidebar()"
    ></button>
  }

  <aside
    class="fixed inset-y-0 left-0 z-30 w-64 -translate-x-full border-r border-stone-200 bg-white transition-transform lg:static lg:translate-x-0"
    [class.translate-x-0]="sidebarOpen()"
  >
    <div class="flex h-full flex-col">
      <a routerLink="/dashboard" class="flex items-center gap-2 px-4 py-4 font-semibold">
        <span
          class="grid size-8 place-items-center rounded-lg bg-coral-600 text-sm font-bold text-white"
          aria-hidden="true"
        >
          SA
        </span>
        <span class="text-sm text-stone-900">{{ appName }}</span>
      </a>

      <nav class="flex-1 space-y-1 px-2 pt-2" aria-label="Main">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-coral-50 text-coral-700"
            ariaCurrentWhenActive="page"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900"
          >
            <span class="size-1.5 rounded-full bg-current opacity-60" aria-hidden="true"></span>
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="border-t border-stone-200 p-4">
        @if (user(); as currentUser) {
          <p class="truncate text-sm font-medium text-stone-900">{{ currentUser.fullName }}</p>
          <p class="truncate text-xs text-stone-500">{{ currentUser.email }}</p>
        }
        <button
          type="button"
          class="btn btn-secondary btn-sm mt-3 w-full"
          [disabled]="signingOut()"
          (click)="signOut()"
        >
          {{ signingOut() ? 'Signing out…' : 'Sign out' }}
        </button>
      </div>
    </div>
  </aside>

  <!-- Content -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-10 flex items-center gap-3 border-b border-stone-200 bg-white/90 px-4 py-3 backdrop-blur"
    >
      <button
        type="button"
        class="rounded-lg p-2 text-stone-500 hover:bg-stone-100 lg:hidden"
        (click)="toggleSidebar()"
      >
        <span class="sr-only">Open menu</span>
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>

      <span class="text-sm font-medium text-stone-500">My account</span>

      <div class="ml-auto flex items-center gap-2">
        <a
          routerLink="/cart"
          class="relative rounded-lg p-2 text-stone-500 hover:bg-stone-100 hover:text-stone-700"
        >
          <span class="sr-only">Cart</span>
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6m3 12a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm10 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
            />
          </svg>
          @if (cartCount() > 0) {
            <span
              class="absolute top-1 right-1 grid min-w-4 place-items-center rounded-full bg-coral-600 px-1 text-[10px] font-semibold text-white"
            >
              {{ cartCount() }}
            </span>
          }
        </a>

        <app-notification-bell />
      </div>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:py-8">
      <router-outlet />
    </main>
  </div>

  <!-- Live notification toast -->
  @if (toast(); as message) {
    <div class="fixed right-4 bottom-4 z-40 w-80">
      <div class="card flex items-start gap-3 p-4 shadow-lg">
        <span class="mt-1.5 size-2 shrink-0 rounded-full bg-coral-600" aria-hidden="true"></span>
        <button type="button" class="min-w-0 flex-1 text-left" (click)="openToast(message.link)">
          <span class="block text-sm font-medium text-stone-900">{{ message.title }}</span>
          <span class="mt-0.5 block text-xs text-stone-600">{{ message.message }}</span>
        </button>
        <button
          type="button"
          class="text-stone-400 hover:text-stone-600"
          aria-label="Dismiss"
          (click)="dismissToast()"
        >
          ×
        </button>
      </div>
    </div>
  }
</div>
